plugins {
	id 'fabric-loom'
}

version = "${mc_version}-${build_number}-FABRIC"
if (System.getenv().RELEASE_MODE != "1") {
    version += '-SNAPSHOT'
}

repositories {
	maven {
		name = "JEI"
		url "https://maven.blamejared.com/"
		content {
			includeGroup "mezz.jei"
		}
	}
	maven {
		name = "Modmuss"
		url = "https://maven.modmuss50.me/"
		content {
			includeGroup "me.zeroeightsix"
		}
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
		content {
			includeGroup "me.shedaniel"
			includeGroup "me.shedaniel.cloth"
		}
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	runs {
		configureEach {
			ideConfigGenerated(true)
			runDir("../run")
		}
		client {
			client()
			setConfigName("Fabric Client")
		}
		server {
			server()
			setConfigName("Fabric Server")
		}
		gameTest {
			server()
			vmArg "-Dfabric-api.gametest=1"
		}
	}
}

dependencies {
	modImplementation "me.zeroeightsix:fiber:0.23.0-2"
	include "me.zeroeightsix:fiber:0.23.0-2"

	minecraft "com.mojang:minecraft:${mc_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	modCompileOnly "maven.modrinth:jei:${jei_version}"

	modCompileOnly("maven.modrinth:rei:${rei_version}") { transitive = false }
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") { transitive = false }
}

compileJava {
	source(rootProject.file("Xplat/src/main/java"))
}

sourcesJar {
	from rootProject.file("Xplat/src/main/java")
}

processResources {
	from rootProject.file("Xplat/src/main/resources")
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

/*
task apiJar(type: Jar, dependsOn: classes) {
	from(sourceSets.main.output)
	include 'vazkii/patchouli/api/**'

	archiveClassifier = "api"
}
*/

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId project.group
			artifactId base.archivesName.get()
			version project.version
			from components.java
		}
	}
	repositories {
		maven {
			url "file://" + System.getenv("local_maven")
		}
	}
}
