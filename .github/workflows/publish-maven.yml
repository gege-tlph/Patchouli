name: Publish to static Maven

on:
  workflow_dispatch:
  push:
    tags:
      - release-1.21.11-*

permissions:
  contents: write

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Checkout Maven repository
        uses: actions/checkout@v5
        with:
          ref: maven
          path: maven-repo

      - name: Build and publish Fabric artifact
        env:
          RELEASE_MODE: "1"
          local_maven: ${{ github.workspace }}/maven-repo
        run: ./gradlew :Fabric:publish --no-daemon

      - name: Commit Maven repository
        working-directory: maven-repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
            exit 0
          fi
          git commit -m "Publish ${GITHUB_REF_NAME}"
          git push origin HEAD:maven
