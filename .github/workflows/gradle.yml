name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - port/1.21.11-fabric
    tags:
      - release-1.21.11-*
  pull_request:
    branches:
      - port/1.21.11-fabric

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check and build Fabric
        env:
          RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/release-') && '1' || '0' }}
        run: ./gradlew :Fabric:pmdMain :Fabric:spotlessJavaCheck :Fabric:build --no-daemon

      - name: Run Fabric GameTests
        run: ./gradlew :Fabric:runGameTest --no-daemon

      - name: Resolve artifact names
        id: artifacts
        shell: bash
        run: |
          MC=$(awk -F '=' '/^mc_version=/ { print $2 }' gradle.properties)
          BUILD=$(awk -F '=' '/^build_number=/ { print $2 }' gradle.properties)
          if [[ "${GITHUB_REF}" == refs/tags/release-* ]]; then
            SUFFIX=""
          else
            SUFFIX="-SNAPSHOT"
          fi
          echo "jar=Fabric/build/libs/Patchouli-${MC}-${BUILD}-FABRIC${SUFFIX}.jar" >> "$GITHUB_OUTPUT"
          echo "sources=Fabric/build/libs/Patchouli-${MC}-${BUILD}-FABRIC${SUFFIX}-sources.jar" >> "$GITHUB_OUTPUT"

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v6
        with:
          name: Patchouli-Fabric-1.21.11
          path: ${{ steps.artifacts.outputs.jar }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach JARs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-')
        env:
          GH_TOKEN: ${{ github.token }}
          FABRIC_JAR: ${{ steps.artifacts.outputs.jar }}
          SOURCES_JAR: ${{ steps.artifacts.outputs.sources }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${FABRIC_JAR}" "${SOURCES_JAR}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${FABRIC_JAR}" "${SOURCES_JAR}" \
              --title "Patchouli ${GITHUB_REF_NAME#release-}" \
              --generate-notes
          fi
