pluginManagement {
    plugins {
        id 'net.neoforged.moddev' version '2.0.105' apply false
        id 'fabric-loom' version '1.17.14' apply false
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

plugins {
    // Required for NeoGradle
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Patchouli'
// This branch targets Fabric only. Xplat remains the shared source tree and is
// compiled by the Fabric project; NeoForge is not configured against 1.21.11.
include("Fabric")
